services:

  ftp-server:
    image: stilliard/pure-ftpd
    container_name: ftp-server
    ports:
      - "21:21"
      - "30000-30009:30000-30009"
    environment:
      - PUBLICHOST=ftp-server
      - FTP_USER_NAME=testuser
      - FTP_USER_PASS=testpass
      - FTP_USER_HOME=/home/testuser
    volumes:
      - ftp-data:/home/testuser:Z

  msc:
    build: ./msc-service
    depends_on:
      - ftp-server
    environment:
      - FTP_HOST=ftp-server
      - FTP_USER=testuser
      - FTP_PASS=testpass

  smsc:
    build: ./smsc-service
    depends_on:
      - ftp-server
    environment:
      - FTP_HOST=ftp-server
      - FTP_USER=testuser
      - FTP_PASS=testpass

  pgw:
    build: ./pgw-service
    depends_on:
      - ftp-server
    environment:
      - FTP_HOST=ftp-server
      - FTP_USER=testuser
      - FTP_PASS=testpass

  billing:
    build: ./billing-service
    ports:
      - "1099:1099"
    volumes:
      - billing-input:/app/input

  fraud:
    build: ./fraud-service
    ports:
      - "1099:1099"
    volumes:
      - fraud-input:/app/input

  mediation:
    build: ./mediation-service
    depends_on:
      - ftp-server
      - billing
      - fraud
    environment:
      - FTP_HOST=ftp-server
      - FTP_USER=testuser
      - FTP_PASS=testpass
      - BILLING_RMI_HOST=billing
      - FRAUD_RMI_HOST=fraud

volumes:
  ftp-data:
  billing-input:
  fraud-input: