# CDR Mediation System Configuration
# Input settings
mediation.input.dir=/var/mediation/input
mediation.input.format=ASN1
mediation.input.encoding=BER
# Output settings
mediation.output.dir=/var/mediation/output
mediation.output.format=CSV
mediation.output.header=true
mediation.output.trailer=true
# Enrichment settings
mediation.enrich.dir=/var/mediation/reference
mediation.enrich.enabled=true
# Duplicate detection
mediation.dedup.enabled=true
mediation.dedup.window.seconds=0
# Aggregation
mediation.aggregation.enabled=true
mediation.aggregation.window.hourly=3600000
mediation.aggregation.window.daily=86400000
# Buffer settings
mediation.buffer.size=1000
mediation.buffer.timeout.seconds=60
# Error handling
mediation.error.log.dir=/var/mediation/logs
mediation.error.alarm.enabled=true
# File watching
mediation.watch.interval.ms=1000