<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In — Mediation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --blue: #1d6be0; --blue-light: #3b82f6; --blue-dim: rgba(29,107,224,0.15);
  --bg: #030307; --bg-secondary: #0a0a14;
  --border: rgba(255,255,255,0.08); --border-bright: rgba(255,255,255,0.15);
  --text-primary: #ffffff; --text-secondary: #cbd5e1; --text-muted: #64748b;
  --radius: 12px; --radius-lg: 20px;
  --success: #10b981; --danger: #ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 50% 30%, rgba(29, 107, 224, 0.18), transparent 500px),
    radial-gradient(circle at 10% 80%, rgba(16, 185, 129, 0.05), transparent 400px);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1.5rem;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: rgba(10, 10, 20, 0.65);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 2.5rem;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(29, 107, 224, 0.1);
  animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.brand-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 2rem;
}

.brand-logo-mark {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.25rem;
  color: #fff;
  box-shadow: 0 0 25px rgba(29, 107, 224, 0.5);
  margin-bottom: 1rem;
}

.brand-title {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 0.25rem;
  background: linear-gradient(to right, #fff, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
}

.form-input {
  width: 100%;
  padding: 0.75rem 1rem;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: #fff;
  font-family: inherit;
  font-size: 0.9rem;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--blue-light);
  background: rgba(255, 255, 255, 0.06);
  box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
}

.btn-submit {
  width: 100%;
  padding: 0.85rem;
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(29, 107, 224, 0.3);
  transition: all 0.2s ease;
  margin-top: 0.5rem;
}

.btn-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(29, 107, 224, 0.5);
}

.btn-submit:active {
  transform: translateY(0);
}

.alert {
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-size: 0.8rem;
  margin-bottom: 1.25rem;
  display: none;
  line-height: 1.4;
}

.alert-danger {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.25);
  color: var(--danger);
}

.alert-success {
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.25);
  color: var(--success);
}
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-section">
    <div class="brand-logo-mark">M</div>
    <h1 class="brand-title">Mediation Console</h1>
    <p class="brand-desc">Sign in to manage security and rates</p>
  </div>

  <div id="alertBox" class="alert alert-danger"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username" class="form-label">Username</label>
      <input type="text" id="username" class="form-input" placeholder="e.g. admin" required autocomplete="username"/>
    </div>
    <div class="form-group" style="margin-bottom: 1.75rem;">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit">Sign In</button>
  </form>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  const btnSubmit = document.getElementById('btnSubmit');
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;

  alertBox.style.display = 'none';
  btnSubmit.disabled = true;
  btnSubmit.textContent = 'Authenticating…';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });

    const d = await res.json();
    if (!res.ok) {
      throw new Error(d.error || 'Authentication failed');
    }

    // Success! Redirect to dashboard
    alertBox.className = 'alert alert-success';
    alertBox.textContent = 'Access granted. Redirecting…';
    alertBox.style.display = 'block';
    
    setTimeout(() => {
      window.location.href = '/dashboard.html';
    }, 800);

  } catch (err) {
    alertBox.className = 'alert alert-danger';
    alertBox.textContent = err.message;
    alertBox.style.display = 'block';
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
